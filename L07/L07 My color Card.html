<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L07 My color Card</title>

        <!--Internal css-->
        <style>
            /*Universal Selector - applies to everything on the page */
            *{
                font-size: 16px;
            }

            /*Element Selectors*/
            body{
                background-color: beige;
            }

            h1{
                color: skyblue;
            }

            h2{
                color: aquamarine;
            }

            p{
                color: blueviolet;
            }

            /*Class Selectot*/ 
            .my-detail {
                color: dimgray;
                font-weight: bold;
            }

            /* ID Selector*/
            #my-card{
                background-color: lightcyan;
            }

        </style>
    </head>
    <body>
        <h1>My Colour Card</h1>

        <!-- Inline Css: Add style="color:_____" inside this p tag -->
         <P style="color: crimson;">
            Hi! This is my very own webpage.
         </p>

        <div id="my-card">
                
                <h2>About Me</h2>
 
               <p class="my-detail">My name is Abdullah.</p>
               <p class="my-detail">My favourite color is Black.</p>
               <p class="my-detail">My favourite subject is Computer.</p>
               <p class="my-detail">My Favourite food is Biryani.</p>

        </div>

        <h2>My Favourite Things </h2>

        <p>My favourite aniaml is a cat.</p>
        <p>My favourite sport is cricket.</p>
        <p>My favourite movie is the Idiots 3</p>
        
    </body>
</html>
