<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L09 My Superhero Cards</title>

        <!--Internl CSS-->
        <style>
            /*Typography - font, size, weight, colour the whole page*/
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }

            /*Typography + Text shadow - big bold title with an orange shadow  */
            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 5px 5px orange ;
            }

            /*Text Transform + Text Decortion - section headings in CAPS with underline */
            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;
            }
            
            /*Text Transform + Text Decortion - section headings in CAPS with underline */
            .label{
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
            }

            /* Typography - the badge - weaknesses are crossed green */
            .power{
                font-weight: bold;
                color: gray;
            }

            /* Text Decoration - weaknesses are crossed out */
            .weakness{
                text-decoration: line-through;
                color: gray;
            }

            /*Text Transform + Text Decortion - section headings in CAPS with underline */
            .badge {
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }
            /*Typography - footer text */
            .made-by {
                color: coral;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">the most powerful hero iin the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">Can run faster than a cheetah</p>
        <P class="power">Can lift a school bus </P>

        <h2 class="label">weaknesses</h2>
        <p class="weakness">Maths homework</p>
        <p class="weakness">Broccoli</p>

        <p class="badge">Top Hero</p>

        <p class="made-by">Created By Abdullah</p>
    </body>
</html>
