<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Food Diary</title>

        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

        <!--internal CSS-->
        <style>
            body{
                background-color: linen;
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 30px;
            }

            h2 {
                color: chocolate;
                margin-top: 25px;
            }

            abbr {
                color: chocolate;
                font-weight: bold;
                cursor: help;
            }

            blockquote {
                border-left: 4px solid chocolate;
                padding-left: 15px;
                color: dimgray;
                font-style: italic;
                text-align: left;
                display: inline-block;
            }

            hr {
                border-color: chocolate;
            }
        </style>
    </head>
    <body>
        <p class="display-1">My Food Diary</p>
        <p class="display-2">My Top Dishes</p>
        <p class="display-3">Fun Food Facts</p>
        <p class="display-4">Food Guide <small>by Abdullah</small></p>

        <hr>

        <h2>Did You Know?</h2>
        <p>
            My favourite way to cook with familly is a good old <abbr title="Barbecue">BBQ</abbr> on a sunny day.
        </p>

        <hr>

        <h2>Food Quote</h2>
        <blockquote>
            <p>"First we eat, then we do everything else."</p>
            <p>-M.F.K. Fisher</p>
        </blockquote>
    </body>
</html>
