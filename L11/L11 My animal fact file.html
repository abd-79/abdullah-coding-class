<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L11 My animal fact file</title>

        <!--internal CSS-->

        <style>
            /* Page background - sets the color and font the whole page */
            body {
                background-color: darkgreen;
                font-family: Arial, sans-serif;
            }

            /* Box Model — width sets the content area padding pushes the text away from the edges border draws a visible frame around the fact file margin pushes the fact file away from the screen edge */
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 4px solid red;
                margin: 30px;
            }

            /* Animal name - forestgreen so it stands out */
            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }

            /* Detail rows - dark text on the light background */
            .detail {
                color: darkslategray;
            }

            /* Cool fact - orange and italic to make it feel special */
            .cool-fact {
                color: darkorange;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">Type: Big cat</p>
            <p class="detail">Lives on Mountains ranges of Central Asia</p>
            <p class="detail">Diet: Deers, Goats, and wild sheep</p>
            <p class="cool-fact">Cool Fact: Can a leap up to 15 meters in one jump! </p>
        </div>
    </body>
</html>
